<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>/*__LEAFLET_CSS__*/</style>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script>/*__LEAFLET_JS__*/</script>
<script>
    L.Marker.prototype.options.icon = L.icon({
        iconUrl: '__MARKER_ICON_URL__',
        iconRetinaUrl: '__MARKER_ICON_RETINA_URL__',
        shadowUrl: '__MARKER_SHADOW_URL__',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });

    var map = L.map('map', {zoomControl: true}).setView([0, 0], 0);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    var markers = {};
    var nextId = 0;

    function addMarker(lat, lng, title) {
        var id = nextId++;
        markers[id] = L.marker([lat, lng]).addTo(map).bindPopup(title);
        return id;
    }

    function removeAllMarkers() {
        for (var id in markers) {
            map.removeLayer(markers[id]);
        }
        markers = {};
    }
</script>
</body>
</html>
