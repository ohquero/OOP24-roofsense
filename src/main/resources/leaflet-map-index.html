<!DOCTYPE html>
<html lang="en">
<head>
    <title>Map</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link crossorigin="" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
    <script crossorigin="" src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-providers@2.0.0/leaflet-providers.min.js"></script>
</head>

<body>
<div id="map"></div>
<script>
    // Disable usage of transform() to move map tiles in order to make JavaFX WebView behave correctly when dragging
    window.L_DISABLE_3D = true;

    let map = L.map('map', {zoomControl: true}).setView([0, 0], 0);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    let markers = {};

    function addMarker(lat, lng, title) {
        let id = crypto.randomUUID();
        markers[id] = L.marker([lat, lng]).addTo(map).bindPopup(title);
        return id;
    }

    function removeAllMarkers() {
        for (let id in markers) {
            map.removeLayer(markers[id]);
        }
        markers = {};
    }
</script>
</body>

</html>
